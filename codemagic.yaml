workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic # <-- nom de l'intégration dans Codemagic UI
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dazu.sora-weather
      groups:
        - sora
      flutter: "3.32.3"
      xcode: "16.4"
      cocoapods: default
    scripts:
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: cd ios && pod install
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sora-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  macos-workflow:
    name: macOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic # <-- nom de l'intégration dans Codemagic UI
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.dazu.sora-weather
      groups:
        - sora
      flutter: "3.32.3"
      xcode: "16.4"
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: cd macos && pod install
      - name: Build and archive macOS
        script: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath /tmp/Sora.xcarchive \
            OTHER_CODE_SIGN_FLAGS="--keychain=$KEYCHAIN_PATH"
      - name: Export package
        script: |
          xcodebuild -exportArchive \
            -archivePath /tmp/Sora.xcarchive \
            -exportPath /tmp/macos_export \
            -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - /tmp/macos_export/*.pkg
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sora-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false


