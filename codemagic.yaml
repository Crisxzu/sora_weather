workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      groups:
        - kumi
      # Référence à l'Android keystore configuré dans Codemagic UI
      # (Code signing identities > Android keystores, reference name: sora_keystore).
      # Codemagic injecte alors CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD /
      # CM_KEY_ALIAS / CM_KEY_PASSWORD dans l'environnement.
      android_signing:
        - sora_keystore
      flutter: "3.41.6"
      # Java 17 requis par le build Android (cf docker/Dockerfile.ci)
      java: 17
    scripts:
      - name: Set up key.properties
        script: |
          # Codemagic expose le keystore via CM_KEYSTORE_PATH et les mots de passe.
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          echo "key.properties written (storeFile=$CM_KEYSTORE_PATH)"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --build-filter="lib/model/**"
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Build AAB + APK (obfuscated)
        script: |
          BUILD_NAME=$(grep "^version:" pubspec.yaml | sed 's/version: //;s/+.*//')
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | sed 's/.*+//')
          flutter build appbundle --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --obfuscate --split-debug-info=./debug/
          flutter build apk --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --obfuscate --split-debug-info=./debug/
      - name: Create GitHub release (draft) with changelog + artifacts
        script: |
          set -e
          # Ce step n'a de sens que sur un build déclenché par tag. Sur un build
          # manuel (CM_TAG vide), on skip proprement sans faire échouer le build.
          if [ -z "$CM_TAG" ]; then
            echo "No CM_TAG (manual build) — skipping GitHub release."
            exit 0
          fi
          # git-cliff génère les notes depuis les commits conventionnels (cliff.toml).
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.6.1/git-cliff-2.6.1-x86_64-apple-darwin.tar.gz \
            | tar xz -C /tmp
          CLIFF=/tmp/git-cliff-2.6.1/git-cliff
          "$CLIFF" --latest --strip all -o RELEASE_NOTES.md || echo "Sora Weather $CM_TAG" > RELEASE_NOTES.md
          # gh est préinstallé sur les machines Codemagic ; GH_TOKEN vient du groupe env.
          export GH_TOKEN="$GITHUB_TOKEN"
          AAB=$(find build -name "*.aab" | head -1)
          APK=$(find build -name "*.apk" | head -1)
          # Crée la release si elle n'existe pas, sinon met à jour ses artefacts.
          if gh release view "$CM_TAG" --repo "$CM_REPO_SLUG" >/dev/null 2>&1; then
            gh release upload "$CM_TAG" "$AAB" "$APK" --clobber --repo "$CM_REPO_SLUG"
          else
            gh release create "$CM_TAG" "$AAB" "$APK" \
              --draft \
              --title "$CM_TAG" \
              --notes-file RELEASE_NOTES.md \
              --repo "$CM_REPO_SLUG"
          fi
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/apk/**/*.apk
      - build/**/mapping.txt
    publishing:
      email:
        recipients:
          - sora-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      # Publication Play Store native Codemagic (remplace Fastlane).
      # Requiert la variable secrète GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      # (contenu du JSON service account) dans le groupe d'env Codemagic.
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
        changes_not_sent_for_review: true

  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic # <-- nom de l'intégration dans Codemagic UI
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dazu.sora-weather
      groups:
        - kumi
      flutter: "3.41.6"
      xcode: "26.0"
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --build-filter="lib/model/**"
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Install pods
        script: cd ios && pod install
      - name: Flutter build ipa
        script: |
          BUILD_NAME=$(grep "^version:" pubspec.yaml | sed 's/version: //;s/+.*//')
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | sed 's/.*+//')
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sora-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  macos-workflow:
    name: macOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - macos/Pods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      groups:
        - kumi
      flutter: "3.41.6"
      xcode: "26.0"
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.dazu.sora-weather \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create
      - name: Set up signing certificates
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --build-filter="lib/model/**"
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Install pods
        script: cd macos && pod install
      - name: Build Flutter macOS
        script: |
          flutter config --enable-macos-desktop
          BUILD_NAME=$(grep "^version:" pubspec.yaml | sed 's/version: //;s/+.*//')
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | sed 's/.*+//')
          flutter build macos --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER
      - name: Package application
        script: |
          set -x
          APP_PATH=$(find "$PWD" -name "*.app" -path "*/Release/*" | head -1)
          echo "Found app: $APP_PATH"
          RELEASE_DIR=$(dirname "$APP_PATH")
          APP_BASE=$(basename "$APP_PATH" .app)
          UNSIGNED_PKG="$RELEASE_DIR/unsigned.pkg"
          PKG_PATH="$RELEASE_DIR/$APP_BASE.pkg"
          xcrun productbuild --component "$APP_PATH" /Applications/ "$UNSIGNED_PKG"
          INSTALLER_CERT_NAME=$(keychain list-certificates \
            | jq -r '.[] | select(.common_name | test("3rd Party Mac Developer Installer")) | .common_name' \
            | head -1)
          echo "Using cert: $INSTALLER_CERT_NAME"
          xcrun productsign --sign "$INSTALLER_CERT_NAME" "$UNSIGNED_PKG" "$PKG_PATH"
          rm -f "$UNSIGNED_PKG"
          echo "Generated pkg: $PKG_PATH"
          ls -la "$RELEASE_DIR"
      - name: Publish to TestFlight
        script: |
          PKG_PATH=$(find "$PWD/build/macos/Build/Products/Release" -name "*.pkg" | head -1)
          echo "Publishing: $PKG_PATH"
          app-store-connect publish \
            --path "$PKG_PATH" \
            --platform MAC_OS \
            --max-build-processing-wait 0
    artifacts:
      - build/macos/Build/Products/Release/*.pkg
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sora-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
