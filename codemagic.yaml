workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dazu.sora-weather
      groups:
        - sora
      vars:
        APP_ID: 6748250805 # <-- Put your APP ID here
      flutter: "3.32.3"
      xcode: "16.4" # <-- set to specific version e.g. 14.3, 15.0 to avoid unexpected updates.
      cocoapods: default
    scripts:
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      #- name: Flutter analyze
      #  script: |
      #    flutter analyze
      #- name: Flutter unit tests
      #  script: |
      #    flutter test
      #  ignore_failure: true
      - name: Flutter build ipa and automatic versioning
        script: |
          # See the following link about getting the latest App Store or TestFlight version - https://docs.codemagic.io/knowledge-codemagic/build-versioning/#app-store-or-testflight-latest-build-number
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number --platform=IOS "$APP_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      # See the following link for details about email publishing - https://docs.codemagic.io/publishing-yaml/distribution/#email
      email:
        recipients:
          - chris@snowsky-dev.com
        notify:
          success: true # To receive a notification when a build succeeds
          failure: false # To not receive a notification when a build fails
      #slack:
      #  # See the following link about how to connect your Slack account - https://docs.codemagic.io/publishing-yaml/distribution/#slack
      #  channel: "#builds"
      #  notify_on_build_start: true # To receive a notification when a build starts
      #  notify:
      #    success: true # To receive a notification when a build succeeds
      #    failure: false # To not receive a notification when a build fails
      #app_store_connect:
      #  auth: integration
#
      #  # Configuration related to TestFlight (optional)
      #  # Note: This action is performed during post-processing.
      #  submit_to_testflight: true
      #  beta_groups: # Specify the names of beta tester groups that will get access to the build once it has passed beta review.
      #    - group name 1
      #    - group name 2
#
      #  # Configuration related to App Store (optional)
      #  # Note: This action is performed during post-processing.
      #  submit_to_app_store: false

  web-workflow:
    name: Web app workflow
    max_build_duration: 10
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter unit tests
        script: |
          flutter test
      - name: Flutter build webapp
        script: |
          flutter build web --release
          cd build/web
          7z a -r ../web.zip ./*
    artifacts:
      - build/web.zip
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - user_1@example.com


