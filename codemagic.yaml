workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic # <-- nom de l'intégration dans Codemagic UI
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dazu.sora-weather
      groups:
        - kumi
      flutter: "3.32.3"
      xcode: "26.0"
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --build-filter="lib/model/**"
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Install pods
        script: cd ios && pod install
      - name: Flutter build ipa
        script: |
          BUILD_NAME=$(grep "^version:" pubspec.yaml | sed 's/version: //;s/+.*//')
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | sed 's/.*+//')
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - kumi-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  macos-workflow:
    name: macOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - macos/Pods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      groups:
        - kumi
      flutter: "3.32.3"
      xcode: "26.0"
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.dazu.sora-weather \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create
      - name: Set up signing certificates
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --build-filter="lib/model/**"
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Install pods
        script: cd macos && pod install
      - name: Build Flutter macOS
        script: |
          flutter config --enable-macos-desktop
          BUILD_NAME=$(grep "^version:" pubspec.yaml | sed 's/version: //;s/+.*//')
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | sed 's/.*+//')
          flutter build macos --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER
      - name: Package application
        script: |
          set -x
          APP_PATH=$(find "$PWD" -name "*.app" -path "*/Release/*" | head -1)
          echo "Found app: $APP_PATH"
          RELEASE_DIR=$(dirname "$APP_PATH")
          APP_BASE=$(basename "$APP_PATH" .app)
          UNSIGNED_PKG="$RELEASE_DIR/unsigned.pkg"
          PKG_PATH="$RELEASE_DIR/$APP_BASE.pkg"
          xcrun productbuild --component "$APP_PATH" /Applications/ "$UNSIGNED_PKG"
          INSTALLER_CERT_NAME=$(keychain list-certificates \
            | jq -r '.[] | select(.common_name | test("3rd Party Mac Developer Installer")) | .common_name' \
            | head -1)
          echo "Using cert: $INSTALLER_CERT_NAME"
          xcrun productsign --sign "$INSTALLER_CERT_NAME" "$UNSIGNED_PKG" "$PKG_PATH"
          rm -f "$UNSIGNED_PKG"
          echo "Generated pkg: $PKG_PATH"
          ls -la "$RELEASE_DIR"
      - name: Publish to TestFlight
        script: |
          PKG_PATH=$(find "$PWD/build/macos/Build/Products/Release" -name "*.pkg" | head -1)
          echo "Publishing: $PKG_PATH"
          app-store-connect publish \
            --path "$PKG_PATH" \
            --platform MAC_OS \
            --max-build-processing-wait 0
    artifacts:
      - build/macos/Build/Products/Release/*.pkg
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - kumi-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
