workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dazu.sora-weather
      groups:
        - sora
      flutter: "3.32.3"
      xcode: "16.4"
      cocoapods: default
    scripts:
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=${CM_TAG#v} \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number --platform=IOS "$APP_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sora-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  macos-workflow:
    name: macOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      macos_signing:
        distribution_type: mac_app_store
        bundle_identifier: com.dazu.sora-weather
      groups:
        - sora
      flutter: "3.32.3"
      xcode: "16.4"
      cocoapods: default
    scripts:
      - name: Generate env file
        script: |
          echo $ENV_FILE | base64 --decode > lib/env/env.g.dart
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build macOS
        script: |
          flutter build macos --release \
            --build-name=${CM_TAG#v} \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number --platform=MAC_OS "$MACOS_APP_ID") + 1))
      - name: Package for Mac App Store
        script: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" | head -1)
          xcrun productbuild \
            --component "$APP_PATH" /Applications \
            --sign "3rd Party Mac Developer Installer: $(keychain list-certificates | grep 'Mac Developer Installer' | awk -F'"' '{print $2}' | head -1)" \
            build/macos/Sora.pkg
    artifacts:
      - build/macos/Sora.pkg
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sora-deployment@snowsky-dev.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  web-workflow:
    name: Web app workflow
    max_build_duration: 10
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter unit tests
        script: |
          flutter test
      - name: Flutter build webapp
        script: |
          flutter build web --release
          cd build/web
          7z a -r ../web.zip ./*
    artifacts:
      - build/web.zip
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - user_1@example.com


