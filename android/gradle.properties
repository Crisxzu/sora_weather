android.useAndroidX=true
android.enableJetifier=false

# Reduce parallel processing to prevent memory spikes
org.gradle.parallel=false
org.gradle.workers.max=1

# Increase heap size but add GC tuning
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:G1HeapRegionSize=16m

# Disable Gradle build cache to reduce I/O pressure
org.gradle.caching=false
