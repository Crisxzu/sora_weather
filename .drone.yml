kind: pipeline
type: docker
name: web-release

# Ce pipeline ne gère QUE le déploiement Web (build image Docker → GHCR → Dokploy).
# Android / iOS / macOS / Windows sont gérés par Codemagic (codemagic.yaml).
# Docker n'étant pas disponible sur les runners macOS Codemagic, le web reste ici.

steps:
  # Build par TAG (release) : image taguée avec la version + latest.
  - name: build-web-tag
    image: plugins/docker
    settings:
      repo: ghcr.io/crisxzu/sora-weather-web
      registry: ghcr.io
      username: crisxzu
      password:
        from_secret: github_token
      tags:
        - ${DRONE_TAG}
        - latest
      build_args_from_env:
        - ENV_FILE
    environment:
      ENV_FILE:
        from_secret: env_file
    when:
      event:
        - tag

  # Build MANUEL (custom, New Build dans l'UI) pour tester : juste latest,
  # car DRONE_TAG n'existe pas sur un build custom.
  - name: build-web-custom
    image: plugins/docker
    settings:
      repo: ghcr.io/crisxzu/sora-weather-web
      registry: ghcr.io
      username: crisxzu
      password:
        from_secret: github_token
      tags:
        - latest
      build_args_from_env:
        - ENV_FILE
    environment:
      ENV_FILE:
        from_secret: env_file
    when:
      event:
        - custom

  - name: deploy-web
    image: curlimages/curl:latest
    commands:
      - |
        curl -sf -X POST "https://$DOKPLOY_HOST/api/application.deploy" \
          -H "x-api-key: $DOKPLOY_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"applicationId\": \"$DOKPLOY_APP_ID\"}"
    environment:
      DOKPLOY_HOST:
        from_secret: dokploy_host
      DOKPLOY_API_TOKEN:
        from_secret: dokploy_api_token
      DOKPLOY_APP_ID:
        from_secret: dokploy_app_id
    depends_on:
      - build-web-tag
      - build-web-custom
    when:
      event:
        - tag
        - custom

trigger:
  event:
    - tag
    - custom

---
kind: secret
name: github_token
get:
  path: secrets/data/ci/github
  name: token
